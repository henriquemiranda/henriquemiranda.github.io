{% if GITHUB_URL %}
<a href="{{ GITHUB_URL }}">
{% if GITHUB_POSITION != "left" %}
<img style="position: absolute; top: 0; right: 0; border: 0;" src="{{ SITEURL }}/theme/images/fork-me-on-github.svg" alt="Fork me on GitHub" />
{% else %}
<img style="position: absolute; top: 0; left: 0; border: 0;" src="{{ SITEURL }}/theme/images/fork-me-on-github.svg" alt="Fork me on GitHub" />
{% endif %}
</a>
{% endif %}
